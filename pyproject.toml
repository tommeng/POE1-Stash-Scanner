[project]
name = "poescan"
version = "0.1.0"
description = "Flag potentially valuable rare items sitting in Path of Exile 1 dump tabs"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tommeng" }]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
poescan = "poescan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poescan"]

[dependency-groups]
dev = ["pytest>=8.0"]
